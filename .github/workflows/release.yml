# Phát hành npm bằng Changesets:
#  - main có file .changeset/*.md chưa phát hành → mở/cập nhật PR "chore: version packages"
#  - merge PR đó → build + `changeset publish` (npm publish + gắn tag vX.Y.Z) + tạo GitHub Release
# Xác thực npm: CHỈ dùng Trusted Publishing (OIDC) — không cần NPM_TOKEN.
#   Cấu hình trên npmjs.com → @itmrhoang/h-ui → Settings → Trusted Publisher → GitHub Actions:
#   owner ITmrHoang · repo h-ui · workflow release.yml · environment npm (hoặc để trống)
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write        # đẩy tag + tạo GitHub Release
  pull-requests: write   # mở PR "version packages"
  id-token: write        # npm Trusted Publishing (OIDC) + provenance

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Tên environment phải khớp cấu hình Trusted Publisher trên npmjs.com (hoặc để trống ở đó)
    environment:
      name: npm
      url: https://www.npmjs.com/package/@itmrhoang/h-ui
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          # KHÔNG đặt registry-url: setup-node sẽ ghi `_authToken=${NODE_AUTH_TOKEN}` vào .npmrc và npm sẽ dùng
          # token rỗng đó thay vì Trusted Publishing (OIDC) → ENEEDAUTH

      # Trusted Publishing cần npm >= 11.5
      - run: npm install -g npm@latest

      - run: npm ci

      - name: Version PR hoặc phát hành
        uses: changesets/action@v2
        with:
          version-script: npm run version-packages
          publish-script: npm run release
          pr-title: 'chore: version packages'
          commit-message: 'chore: version packages'
          create-github-releases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
